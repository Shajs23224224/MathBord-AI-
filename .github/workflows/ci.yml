name: MathBord CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathbord-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, tests and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Architecture checks
        run: bash scripts/verify-architecture.sh
      - name: Build, lint and test
        run: ./gradlew :shared:desktopTest :android:app:lintDebug :android:app:testDebugUnitTest :android:app:assembleDebug
      - name: Build Android release artifacts
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease
      - name: Verify Android release artifacts
        run: bash scripts/verify-android-release.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mathbord-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mathbord-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: mathbord-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  android-instrumented:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :android:app:connectedDebugAndroidTest

  desktop:
    name: Windows Desktop build, package and verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: JVM tests and compilation
        shell: pwsh
        run: ./gradlew :shared:desktopTest :desktopApp:jvmTest :desktopApp:compileKotlinJvm
      - name: Package Windows EXE
        shell: pwsh
        run: ./gradlew :desktopApp:packageExe
      - name: Package Windows MSI
        shell: pwsh
        run: ./gradlew :desktopApp:packageMsi
      - name: Verify Windows artifacts
        shell: pwsh
        run: ./scripts/verify-windows-artifacts.ps1
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: mathbord-windows-exe
          path: desktopApp/build/compose/binaries/**/*.exe
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: mathbord-windows-msi
          path: desktopApp/build/compose/binaries/**/*.msi

  performance:
    name: Android startup benchmark
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Macrobenchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :android:macrobenchmark:connectedCheck